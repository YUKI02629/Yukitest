<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #0b1a3a, #0d0d0d);
    color:white;
}

.box{
    width:360px;
    padding:28px;
    border-radius:18px;
    background:rgba(20,20,35,0.95);
    border:1px solid #6a5cff;
    text-align:center;
    box-shadow:0 0 25px rgba(0, 140, 255, 0.15),
               0 0 25px rgba(138,43,226,0.25);
}

h2{
    color:#cbb6ff;
    margin-bottom:18px;
    font-size:18px;
}

button{
    width:100%;
    padding:11px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    color:white;
    background:linear-gradient(135deg,#6a5cff,#2f9bff);
}

input{
    width:100%;
    padding:10px;
    margin:7px 0;
    border-radius:10px;
    border:none;
}
</style>
</head>

<body>

<div class="box">
    <h2 id="q">Как тебя зовут?</h2>
    <div id="btns"></div>
</div>

<script>
let step = 0;
let username = "";
let mods = "";

const q = document.getElementById("q");
const btns = document.getElementById("btns");

function render(){
    btns.innerHTML = "";

    if(step === 0){
        const input = document.createElement("input");
        input.placeholder = "Имя...";
        btns.appendChild(input);

        add("Дальше", ()=>{
            username = input.value || "Игрок";
            step = 1;
            render();
        });
    }

    else if(step === 1){
        q.innerText = "Ты пойдёшь со мной играть?";
        add("Да", ()=>{ step=2; render(); });
        add("Нет", ()=>{ q.innerText="Попробуй ещё раз 🙂"; });
    }

    else if(step === 2){
        q.innerText = "Во что играем?";
        add("Minecraft", ()=>{ step=3; render(); });
        add("Valorant", ()=>{ step=5; render(); });
    }

    else if(step === 3){
        q.innerText = "С модами или без?";
        add("С модами", ()=>finishMods());
        add("Без модов", ()=>finish("Minecraft без модов"));
    }

    else if(step === 5){
        q.innerText = "Дуо или пати?";
        add("Дуо", ()=>finish("Valorant дуо"));
        add("Пати", ()=>finish("Valorant пати"));
    }
}

function add(text, fn){
    const b=document.createElement("button");
    b.innerText=text;
    b.onclick=fn;
    btns.appendChild(b);
}

function finishMods(){

    q.innerText = "Какие моды хочешь?";
    btns.innerHTML = "";

    const input = document.createElement("input");
    input.placeholder = "Optifine, JEI, shaders...";
    btns.appendChild(input);

    const b = document.createElement("button");
    b.innerText = "Готово";

    b.onclick = ()=>{
        mods = input.value || "не указано";
        finish("Minecraft с модами");
    };

    btns.appendChild(b);
}

function finish(text){
    q.innerText = "Готово, " + username + ": " + text;
    btns.innerHTML = "";

    const send = document.createElement("button");
    send.innerText = "Отправить в Telegram";

    const restart = document.createElement("button");
    restart.innerText = "Начать заново";

    send.onclick = async () => {

        const TOKEN = "8735361755:AAGT4mn6YhUlKTFMFUd7N-7X1cHilLtyAJM";
        const CHAT_ID = "7954831780";

        const message =
`🎮 Новый результат
👤 Имя: ${username}
📊 Результат: ${text}
🧩 Моды: ${mods || "нет"}
⏰ Время: ${new Date().toLocaleString()}`;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: "POST",
                headers: {"Content-Type":"application/json"},
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });

            alert("Отправлено ✔");
        } catch (e) {
            alert("Ошибка отправки ❌");
        }
    };

    restart.onclick = ()=>{
        step = 0;
        username = "";
        mods = "";
        render();
    };

    btns.appendChild(send);
    btns.appendChild(restart);
}

render();
</script>

</body>
</html>
