<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background: radial-gradient(circle at top, #0b1a3a, #0d0d0d);
    color:white;
}

.box{
    width:360px;
    padding:28px;
    border-radius:18px;
    background:rgba(20,20,35,0.95);
    border:1px solid #6a5cff;
    text-align:center;
    box-shadow:0 0 25px rgba(0, 140, 255, 0.15),
               0 0 25px rgba(138,43,226,0.25);
    animation: fadeIn 0.4s ease;
}

h2{
    color:#cbb6ff;
    margin-bottom:18px;
    font-size:18px;
    transition:0.3s;
    text-shadow:0 0 10px rgba(0,140,255,0.2);
}

button{
    width:100%;
    padding:11px;
    margin:7px 0;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:14px;
    color:white;
    background:linear-gradient(135deg,#6a5cff,#2f9bff);
    transition:0.2s;
}

button:hover{
    transform:scale(1.03);
    filter:brightness(1.15);
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="box">
    <h2 id="q">Ты пойдёшь со мной играть?</h2>
    <div id="btns"></div>
</div>

<script>
let step = 0;

const q = document.getElementById("q");
const btns = document.getElementById("btns");

function render(){
    btns.innerHTML = "";

    if(step === 0){
        add("Да", ()=>{ step=1; render(); });
        add("Нет", ()=>{ q.innerText="Попробуй ещё раз 🙂"; });
    }

    else if(step === 1){
        q.innerText = "Во что играем?";
        add("Minecraft", ()=>{ step=2; render(); });
        add("Valorant", ()=>{ step=3; render(); });
    }

    else if(step === 2){
        q.innerText = "С модами или без?";
        add("С модами", ()=>finish("Minecraft с модами"));
        add("Без модов", ()=>finish("Minecraft без модов"));
    }

    else if(step === 3){
        q.innerText = "Дуо или пати?";
        add("Дуо", ()=>finish("Valorant дуо"));
        add("Пати", ()=>finish("Valorant пати"));
    }
}

function add(text, fn){
    const b=document.createElement("button");
    b.innerText=text;
    b.onclick=fn;
    btns.appendChild(b);
}

function finish(text){
    q.innerText = "Результат: " + text;
    btns.innerHTML = "";

    const b=document.createElement("button");
    b.innerText="Отправить результат";

    b.onclick = async () => {

        const TOKEN = "8735361755:AAGT4mn6YhUlKTFMFUd7N-7X1cHilLtyAJM";
        const CHAT_ID = "7954831780";

        const message = "🎮 Результат теста: " + text;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message
                })
            });

            alert("Отправлено в Telegram ✔");
        } catch (e) {
            alert("Ошибка отправки ❌");
        }
    };

    btns.appendChild(b);
}

render();
</script>

</body>
</html>
